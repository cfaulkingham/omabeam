name: Verify OmaBeam
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  omarchy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - run: python -m pip install 'PySide6-Essentials>=6.8,<6.11'
      - run: pyside6-qmllint omarchy-plugin/ShareContent.qml omarchy-plugin/ShareButton.qml omarchy-plugin/OmabeamIcon.qml
      - run: python tests/omarchy_ui.py --screenshots target/omarchy-qa
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake nasm pkg-config libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev sway swaybg
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/firewall.py
      - run: python tests/packaging.py
      - run: python -m pip install 'Pillow>=10,<13' 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium chrome
      - run: python tests/smoke.py --binary target/debug/omabeam --browser
      - run: python tests/webrtc.py --binary target/debug/omabeam
      - name: Headless compositor output and region capture
        run: sh tests/linux-capture.sh target/debug/omabeam
