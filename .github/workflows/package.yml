name: Package OmaBeam
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check manifest, Cargo version and release tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          args=(--check-version)
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            args+=(--tag "${RELEASE_REF#refs/tags/}")
          fi
          version=$(python3 scripts/release-assets.py "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cast:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cpu: x64
          - arch: aarch64
            cpu: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build dependencies for the pinned Cast toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3
      - uses: actions/cache@v4
        with:
          path: target/native-cast
          key: release-cast-${{ matrix.arch }}-${{ hashFiles('native/omabeam-cast/upstream.json', 'scripts/build-cast.py') }}
      - name: Build Cast for the target architecture
        run: python3 scripts/build-cast.py --sync --target-cpu "${{ matrix.cpu }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cast-${{ matrix.arch }}
          path: |
            target/native-cast/openscreen/out/omabeam/omabeam-cast
            target/native-cast/notices/
          if-no-files-found: error

  linux-bundle:
    needs: [metadata, cast]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Omarchy's multi-architecture builder
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-pkgs
          ref: 93b1d62ef09bdcd7515e2db6907833f73d2158ed
          path: target/omarchy-pkgs
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cast-${{ matrix.arch }}
          path: target/cast-download
      - name: Stage the Cast executable and notices
        run: |
          mkdir -p target/cast dist
          install -m 755 target/cast-download/openscreen/out/omabeam/omabeam-cast target/cast/omabeam-cast
          cp -a target/cast-download/notices target/cast/notices
          # The container's unprivileged builder must be able to create outputs.
          chmod a+rwx target dist
      - name: Build the native Omarchy package environment
        run: |
          target/omarchy-pkgs/bin/builder-image build --arch "${{ matrix.arch }}" --mirror stable --tag omabeam-builder
      - name: Build, test and package all three executables on native hardware
        run: |
          docker run --rm --init --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CARGO_INCREMENTAL=0 -e CARGO_PROFILE_DEV_DEBUG=0 -e CARGO_PROFILE_TEST_DEBUG=0 \
            omabeam-builder bash scripts/ci-package.sh "${{ matrix.arch }}-unknown-linux-gnu"
      - uses: actions/upload-artifact@v4
        with:
          name: omabeam-omarchy-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release-assets:
    needs: [metadata, linux-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: omabeam-omarchy-linux-*
          merge-multiple: true
          path: dist
      - name: Verify both bundles
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum --check ./*.tar.gz.sha256
      - name: Generate the AUR binary package with real checksums
        if: ${{ !contains(needs.metadata.outputs.version, '-') }}
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/release-assets.py
          # Generate canonical metadata using makepkg, without building or installing.
          docker run --rm -v "$GITHUB_WORKSPACE/dist/aur:/src:ro" -w /src \
            archlinux:latest bash -euc '
              useradd -m builder
              install -o builder -g builder -m 644 /src/PKGBUILD /home/builder/PKGBUILD
              su builder -s /bin/bash -c "cd /home/builder && makepkg --printsrcinfo"
            ' \
            > dist/aur/.SRCINFO
          bash -n dist/aur/PKGBUILD
          tar -czf "dist/omabeam-$RELEASE_VERSION-aur.tar.gz" -C dist/aur PKGBUILD .SRCINFO
          cd dist
          sha256sum "omabeam-$RELEASE_VERSION-aur.tar.gz" > "omabeam-$RELEASE_VERSION-aur.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: omabeam-release-assets
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*-runtime-libraries.txt
          if-no-files-found: error

  draft-release:
    needs: release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omabeam-release-assets
          path: dist
      - name: Attach verified artifacts to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$state" != true ]]; then
              echo '::error::Refusing to replace assets on a published release'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            args=(--draft --verify-tag --generate-notes)
            [[ "$RELEASE_TAG" != *-* ]] || args+=(--prerelease)
            gh release create "$RELEASE_TAG" dist/* "${args[@]}" --title "OmaBeam $RELEASE_TAG" \
              --notes 'Omarchy-only bundles for x86_64 and experimental ARM64. Both include the app, hardware encoder and experimental video-only Google Cast helper. Each uses its architecture’s Arch runtime libraries; see the attached dependency reports. ARM64 requires an existing compatible Omarchy installation. Review RELEASING.md and the Cast qualification status before publishing. The AUR recipe is included for stable releases; it has not been submitted to AUR.'
          fi
