<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OmaBeam</title>
<style>
:root {
  color-scheme: dark;
  --background: #161b24; --foreground: #d6deeb; --accent: #a5c9ad; --urgent: #e49393;
  --muted: color-mix(in srgb, var(--foreground) 68%, transparent);
  --outline: color-mix(in srgb, var(--foreground) 12%, transparent);
  font-family: system-ui, sans-serif; background: var(--background); color: var(--foreground);
}
/* host-theme */
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; font-size: 14px; }
header { flex-shrink: 0; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; border-bottom: 1px solid var(--outline); }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-mark { width: 38px; height: 38px; flex: none; border-radius: 6px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); display: grid; place-items: center; }
h1 { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
.subtitle { margin: 0; color: var(--muted); font-size: 12px; }
nav { display: flex; flex-wrap: wrap; gap: 8px; }
button, a { font: inherit; font-size: 12px; font-weight: 600; color: inherit; background: color-mix(in srgb, var(--foreground) 4%, var(--background)); border: 1px solid color-mix(in srgb, var(--foreground) 18%, transparent); border-radius: 6px; min-height: 38px; padding: 8px 12px; text-decoration: none; cursor: pointer; }
button:hover, a[href]:hover { background: color-mix(in srgb, var(--foreground) 12%, var(--background)); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:disabled, a:not([href]) { opacity: 0.45; cursor: default; }
#stage { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; position: relative; background: color-mix(in srgb, var(--background) 90%, black); }
#stage.contain img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#stage.width { display: block; }
#stage.width img { display: block; width: 100%; height: auto; }
#stage.actual { display: block; }
#stage.actual img { display: block; max-width: none; max-height: none; }
#stage:fullscreen, #stage.expanded { width: 100vw; height: 100dvh; }
#stage.expanded { position: fixed; inset: 0; z-index: 10; }
#exit { display: none; position: fixed; top: 12px; right: 12px; z-index: 11; }
#stage:fullscreen #exit, #stage.expanded #exit { display: block; }
#disconnected {
  display: none;
  margin: 0;
  padding: 24px;
  max-width: 16ch;
  text-align: center;
  font-size: clamp(2.5rem, 9vw, 5.5rem);
  font-weight: 650;
  letter-spacing: -0.04em;
  line-height: 1.1;
}
#view:not([src]),
#stage.ended #view { display: none !important; }
#stage.ended { display: grid !important; place-items: center; }
#stage.ended #disconnected { display: block; }
footer { flex-shrink: 0; padding: 12px 20px; font-size: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; border-top: 1px solid var(--outline); color: var(--muted); }
#source, #error { overflow-wrap: anywhere; }
#error { color: var(--urgent); }
#error:empty { display: none; }
#status { color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
#status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
body[data-state="live"] #status, body[data-state="ended"] #status { color: var(--urgent); }
@media (max-width: 560px) {
  header { padding: 12px 16px; gap: 12px; }
  nav { width: 100%; }
  nav > * { flex: 1; text-align: center; padding-inline: 8px; }
  footer { padding: 10px 16px; }
}
@media (max-width: 400px) {
  nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 17 17" fill="currentColor"><rect width="7" height="7" rx="1"/><rect x="10" width="7" height="7" rx="1"/><rect y="10" width="7" height="7" rx="1"/><rect x="10" y="10" width="7" height="7" rx="1" opacity=".35"/></svg></span>
    <div><h1>OmaBeam</h1><p class="subtitle">Watch a shared window, screen, or area</p></div>
  </div>
  <nav aria-label="Viewer controls"><button id="pause">Pause</button><button id="fit">Fit: contain</button><a id="snapshot" href="frame.jpg" download="omabeam.jpg">Snapshot</a><button id="fullscreen">Fullscreen</button></nav>
</header>
<main id="stage" class="contain"><img id="view" alt=""><h2 id="disconnected">OmaBeam disconnected</h2><button id="exit">Exit fullscreen</button></main>
<footer><span id="status" role="status">Connecting…</span><span id="metrics"></span><span id="source"></span><span id="error" role="alert"></span></footer>
<script>
const img = document.getElementById('view');
const stage = document.getElementById('stage');
const status = document.getElementById('status');
const error = document.getElementById('error');
const pause = document.getElementById('pause');
let paused = false, ended = false, retry = null, fit = 0, failures = 0;
function setStatus(message, state) { status.textContent = message; document.body.dataset.state = state; }
const fits = ['contain', 'width', 'actual'];
const fitLabels = ['contain', 'fill width', 'actual size'];
function connect() {
  clearTimeout(retry); retry = null;
  if (!paused && !ended) { img.src = 'stream?t=' + Date.now(); setStatus('Connecting…', 'connecting'); }
}
function reconnect() {
  if (!paused && !ended && retry === null) retry = setTimeout(connect, 1500);
}
function finish(message) {
  ended = true; clearTimeout(retry); retry = null;
  img.removeAttribute('src'); pause.disabled = true;
  document.getElementById('snapshot').removeAttribute('href');
  stage.classList.add('ended');
  setStatus('Share ended', 'ended'); error.textContent = message;
}
img.onerror = () => {
  if (!paused && !ended) {
    img.removeAttribute('src');
    setStatus('Reconnecting…', 'connecting');
    reconnect();
  }
};
pause.onclick = () => {
  paused = !paused; clearTimeout(retry); retry = null;
  pause.textContent = paused ? 'Resume' : 'Pause';
  if (paused) { img.removeAttribute('src'); setStatus('Paused', 'paused'); } else connect();
};
document.getElementById('fit').onclick = e => {
  stage.classList.remove(fits[fit]); fit = (fit + 1) % fits.length; stage.classList.add(fits[fit]);
  e.target.textContent = 'Fit: ' + fitLabels[fit];
};
async function fullscreen() {
  try { if (stage.requestFullscreen) await stage.requestFullscreen(); else stage.classList.add('expanded'); }
  catch { stage.classList.add('expanded'); }
}
async function exitFullscreen() {
  stage.classList.remove('expanded');
  if (document.fullscreenElement) await document.exitFullscreen();
}
document.getElementById('fullscreen').onclick = fullscreen;
document.getElementById('exit').onclick = exitFullscreen;
addEventListener('keydown', e => { if (e.key === 'Escape') exitFullscreen(); if (e.key === 'f') fullscreen(); });
async function poll() {
  try {
    const response = await fetch('stats', {cache: 'no-store', signal: AbortSignal.timeout(3000)});
    if (!response.ok) throw new Error('Status unavailable');
    const stats = await response.json(); failures = 0;
    document.getElementById('metrics').textContent = `${stats.width}×${stats.height} · ${stats.fps.toFixed(1)} fps · ${stats.viewers} viewer${stats.viewers === 1 ? '' : 's'}`;
    document.getElementById('source').textContent = stats.source;
    error.textContent = stats.error || '';
    if (stats.state === 'ended') finish(stats.error || 'The source is no longer available.');
    else if (!paused) setStatus(stats.fps > 0 ? 'Live' : 'Live · waiting for changes', 'live');
  } catch {
    if (!ended) {
      failures++;
      setStatus(paused ? 'Paused' : 'Connection lost', paused ? 'paused' : 'connecting');
      error.textContent = 'The share may have stopped. Reconnecting…';
      // Do not leave an old image presented as a live share.
      img.removeAttribute('src'); reconnect();
      if (failures >= 5) finish('The share stopped or the connection was lost. Reload to try again.');
    }
  }
  if (!ended) setTimeout(poll, 1000);
}
connect(); poll();
</script>
</body>
</html>
