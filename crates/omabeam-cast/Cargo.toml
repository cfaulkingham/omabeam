[package]
name = "omabeam-cast"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded IPC client for OmaBeam's native Open Screen helper"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omabeam-encoder = { path = "../omabeam-encoder", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
openh264 = "0.9.8"
