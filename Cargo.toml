[package]
name = "omabeam"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Window, screen, and area sharing for Omarchy and Hyprland"
repository = "https://github.com/cfaulkingham/omabeam"
readme = "README.md"

[workspace]
members = ["crates/omabeam-capture"]
exclude = ["vendor/localsend"]
resolver = "3"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gethostname = "1"
gpui-kit = { version = "=0.6.0", default-features = false }
gpui-omarchy = "0.1.0"
if-addrs = "0.15"
localsend = { path = "vendor/localsend", features = ["discovery"] }
rustix = { version = "1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
omabeam-capture = { path = "crates/omabeam-capture" }
openh264 = "0.9.8"
str0m = "0.23.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
bytes = "1"
tempfile = "3"
