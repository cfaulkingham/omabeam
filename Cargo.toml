[package]
name = "omabeam"
version = "0.1.0"
edition = "2024"
default-run = "omabeam"
license = "MIT"
description = "Window, screen, and area sharing for Omarchy and Hyprland"
repository = "https://github.com/cfaulkingham/omabeam"
readme = "README.md"

[workspace]
members = ["crates/omabeam-capture", "crates/omabeam-encoder", "crates/omabeam-cast"]
default-members = [".", "crates/omabeam-encoder"]
exclude = ["vendor/localsend"]
resolver = "3"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gethostname = "1"
gpui-kit = { version = "=0.6.0", default-features = false }
gpui-omarchy = "0.1.0"
if-addrs = "0.15"
localsend = { path = "vendor/localsend", features = ["discovery"] }
rustix = { version = "1", features = ["event", "fs", "pipe", "process", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
omabeam-capture = { path = "crates/omabeam-capture" }
omabeam-cast = { path = "crates/omabeam-cast" }
omabeam-encoder = { path = "crates/omabeam-encoder", default-features = false }
openh264 = "0.9.8"
openh264-sys2 = "0.9.8"
str0m = "0.23.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
bytes = "1"
image = { version = "0.25", default-features = false }
quircs = "0.10"
tempfile = "3"
